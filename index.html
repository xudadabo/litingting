<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>徐博的网页</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 0;
        color: #333;
      }
      .page-wrapper {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
      }
      .hero {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 10px 10px;
        border-radius: 15px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .hero h1 {
        font-size: 2rem;
        margin-bottom: 15px;
      }
      .hero p {
        font-size: 1rem;
        max-width: 600px;
        margin: 0 auto 30px;
      }
      .hero img {
        width: 300px;
        height: auto;
        border-radius: 15px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      .card {
        background: rgb(90, 108, 190);
        color: white;
        padding: 10px 10px;
        box-shadow: 0 5px 10px;
        border-radius: 15px;
        text-align: center;
        border: 1px solid #e1e1e1;
      }
      .card img {
        width: 300px;
        height: auto;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 2px solid #f0f0f0;
      }
      .card p {
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .footer {
        text-align: center;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
        border-top: 1px solid #eee;
      }
      .footer p {
        margin: 0;
        font-size: 1.1rem;
        color: #666;
      }
      .footer a {
        color: #4a6bff;
        text-decoration: none;
        font-weight: bold;
      }
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="hero">
        <h1>欢迎来到李婷婷的主页</h1>
        <p>你好，我是徐博，这是我对象李婷婷。</p>
        <img
          src="https://i.imgs.ovh/2026/05/18/1ffa6aa4f3bd4ef9bd9128f54bea5a90.jpg"
          alt="徐博与李婷婷"
        />
      </header>

      <section class="content">
        <div class="card">
          <img
            src="https://i.imgs.ovh/2026/05/19/4f99082ea54b5681b2d7b845f97ea6cd.jpg"
            alt="李婷婷"
          />
          <p>瞅我呢！</p>
        </div>
      </section>

      <footer class="footer">
        <p>
          我对象 •
          <a
            href="https://i.imgs.ovh/2026/05/18/2b2ab0c485b29ff0b6d8d7447354f52d.jpg"
            >证明材料</a
          >
        </p>
      </footer>
    </div>
  </body>
</html>
